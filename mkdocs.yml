site_name: Aeronautics Ikaria
site_description: Документация модпака Aeronautics Ikaria
site_author: Ikaria Team

# Replace with the real repository values.
site_url: https://YOUR_USER.github.io/YOUR_REPOSITORY/
repo_name: YOUR_USER/YOUR_REPOSITORY
repo_url: https://github.com/YOUR_USER/YOUR_REPOSITORY
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  font: false
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Ночная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Дневная тема
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/ikaria.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - ru
        - en

nav:
  - Обзор:
      - index.md
      - Концепция: overview/concept.md
      - Как читать документацию: overview/reading-docs.md
  - Старт:
      - start/index.md
      - Установка: start/installation.md
      - Первый игровой цикл: start/first-session.md
      - Прогрессия: start/progression.md
      - FTB Quests: start/quests.md
  - Мир и путешествия:
      - world/index.md
      - Небесные острова: world/sky-islands.md
      - Корабли: world/ships.md
      - Маршруты и станции: world/routes-and-stations.md
      - Вормхолы и порталы: world/wormholes.md
  - Механики:
      - systems/index.md
      - Рынок: systems/economy/market.md
      - P2P-курьеры: systems/economy/courier-contracts.md
      - Валюта и комиссии: systems/economy/currency-and-taxes.md
      - Чертежи: systems/industry/blueprints.md
      - Новые тиры: systems/industry/new-tier-crafting.md
      - Зачарование: systems/industry/enchanting.md
  - Моды:
      - mods/index.md
      - Каталог модов: mods/catalog.md
      - Aeronautics: mods/aeronautics.md
      - Create: mods/create.md
      - FTB Quests: mods/ftb-quests.md
      - Собственные моды: mods/custom/index.md
  - Дневники:
      - journals/index.md
      - Дневник инженера: journals/create-diary.md
      - Журнал пилота: journals/aeronautics-diary.md
      - Записки искателя: journals/adventure-diary.md
  - Справочник EVE:
      - eve-reference/index.md
      - Глоссарий: eve-reference/glossary.md
      - Рынок: eve-reference/market.md
      - Вормхоллы: eve-reference/wormhole-space.md
      - Курьеры и контракты: eve-reference/hauling-and-contracts.md
      - Корабли и роли: eve-reference/ships-and-roles.md
      - Индустрия и исследования: eve-reference/industry-and-research.md
  - Разработка:
      - development/index.md
      - Реестр модов: development/mod-registry.md
      - Конфигурация: development/configuration.md
      - Рецепты и датапаки: development/recipes-and-datapacks.md
      - Авторинг квестов: development/quest-authoring.md
      - Баланс: development/balance.md
      - Тестирование: development/testing.md
      - Changelog: development/changelog.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YOUR_USER/YOUR_REPOSITORY
    - icon: fontawesome/brands/discord
      link: https://discord.gg/YOUR_INVITE

copyright: Copyright &copy; 2026 Ikaria Team
