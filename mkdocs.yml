site_name: Aeronautics Ikaria
site_description: Документация модпака Aeronautics Ikaria
site_author: Ikaria Team
site_url: https://poligorn.github.io/MC-ASI-Online/

# Repository
repo_name: poligorn/MC-ASI-Online
repo_url: https://poligorn.github.io/MC-ASI-Online/
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: ru
  custom_dir: overrides
  
  palette:
    # Light mode - Sky theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Переключить на тёмную тему
    
    # Dark mode - Night sky
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: pink
      toggle:
        icon: material/weather-night
        name: Переключить на светлую тему
  
  font:
    text: Roboto
    code: Courier New
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  
  icon:
    repo: fontawesome/brands/github
    logo: material/airplane

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Markdown Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: На этой странице
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: 
        - ru
        - en
  - tags

# Navigation
nav:
  - Главная: index.md
  - Начало работы:
      - getting-started/index.md
      - Установка: getting-started/installation.md
      - Первый запуск: getting-started/first-launch.md
  - Моды:
      - mods/index.md
      - Список модов: mods/mod-list.md
      - Aeronautics: mods/aeronautics.md
  - Механики:
      - mechanics/index.md
      - Летающие острова: mechanics/flying-islands.md
      - Воздушные корабли: mechanics/airships.md
  - Гайды:
      - guides/index.md
      - Первые шаги: guides/getting-started-guide.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Poligorn/Aeronautics-SkyIslands-Modpack
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/7zqnTUaDm2
      name: Discord
  
  generator: false

# Copyright
copyright: |
  Copyright &copy; 2026 Ikaria Team<br>
  <small>🎈 Будущее имя: Aeronautics Ikaria</small>
