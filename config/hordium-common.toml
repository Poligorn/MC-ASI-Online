#How often (in ticks) each player is rolled against the raid chance. 20 ticks = 1 second.
# Default: 200
# Range: 20 ~ 12000
checkIntervalTicks = 200
#Chance (0.0-1.0) that a raid starts near an eligible player on each check.
# Default: 0.001
# Range: 0.0 ~ 1.0
baseChancePerCheck = 0.001
#Maximum number of custom raids that may be active at once in a single dimension.
# Default: 2
# Range: 1 ~ 20
maxConcurrentRaidsPerLevel = 2
#Minimum distance (blocks) a new raid must keep from any other active raid in the same dimension.
# Default: 96.0
# Range: 8.0 ~ 5000.0
minRaidDistance = 96.0
#If no player stays within playerTrackRadius of an in-progress raid for this many ticks, it is cancelled.
# Default: 1800
# Range: 100 ~ 72000
abandonTicks = 1800
#Passive time limit (in ticks) for a single raid, counted from the moment it starts. 20 ticks = 1 second, 48000 = 40 minutes. Once it elapses, already-spawned mobs are left alone but no further waves spawn.
# Default: 48000
# Range: 1200 ~ 432000
raidExpireTicks = 48000
#Radius (blocks) around a raid's center used to show its boss bar, announcements and to detect abandonment.
# Default: 128.0
# Range: 16.0 ~ 1000.0
playerTrackRadius = 128.0
#If true, raids will only start at positions that can see the sky. Off by default, so raids can also start underground/in caves.
requireSkyVisible = false
#Dimensions (resource locations) in which custom raids are allowed to randomly start.
allowedDimensions = ["minecraft:overworld"]
