#Seconds between /war start and the chunk becoming contested.
# Default: 300
# Range: 5 ~ 86400
preparation_seconds = 300
#Maximum active war duration in seconds.
# Default: 3600
# Range: 60 ~ 604800
max_duration_seconds = 3600
#Maximum simultaneous active/preparing wars involving one side.
# Default: 1
# Range: 1 ~ 128
max_active_wars_per_party = 1
#Whether diagonal adjacency counts when checking if a target chunk is a border chunk.
allow_diagonal_border_chunks = false
#Players with no tracked interaction for this many seconds are treated as AFK.
# Default: 300
# Range: 30 ~ 86400
afk_seconds = 300
#Seconds to mark a won/lost target chunk as post-war protected.
# Default: 1800
# Range: 0 ~ 604800
post_war_protection_seconds = 1800

[war]
	#Fake player UUID that temporarily owns OPC claims while a war chunk is contested.
	contested_owner_uuid = "00000000-0000-0000-0000-00000000cc01"
	#Display name used in logs/messages for the fake contested claim owner.
	contested_owner_name = "Contested War"

	[war.capture]
		#Capture progress assigned when the active phase starts.
		# Default: 50.0
		# Range: 0.0 ~ 100.0
		starting_progress = 50.0
		#Progress weight per non-AFK participant standing in the contested chunk each second.
		# Default: 0.35
		# Range: 0.0 ~ 100.0
		player_weight_per_second = 0.35
		#Flat bonus progress per second when at least one non-AFK attacker is in the contested chunk.
		# Default: 0.25
		# Range: 0.0 ~ 100.0
		attacker_presence_bonus_per_second = 0.25
		#Progress decay per second when no non-AFK attackers or defenders are in the contested chunk.
		# Default: 0.5
		# Range: 0.0 ~ 100.0
		empty_chunk_decay_per_second = 0.5

	[war.daily_start_limit]
		#Maximum successful war target chunk starts per attacking side per configured day. Set to 0 to disable.
		# Default: 5
		# Range: 0 ~ 1024
		max_started_chunks_per_attacker_side = 5
		#Maximum successful incoming war target chunk starts per defending side per configured day. Set to 0 to disable.
		# Default: 10
		# Range: 0 ~ 1024
		max_accepted_chunks_per_defender_side = 10

	[war.lives]
		#Personal war lives assigned to each current attacker/defender side member when a war becomes active.
		# Default: 3
		# Range: 1 ~ 100
		starting_lives = 3
		#If true, active war lives are shown in the vanilla sidebar scoreboard.
		scoreboard_sidebar_enabled = true
		#Objective name used for the war lives sidebar scoreboard.
		scoreboard_objective = "cc_war_lives"

[raid_window]
	#If enabled, /war start is blocked inside configured raid windows.
	enable_raid_window = true
	#Timezone for raid windows.
	timezone = "Europe/Moscow"
	#Blocked raid windows in HH:mm-HH:mm form.
	blocked_windows = ["04:00-08:00"]
	#If false, active wars are failed when a blocked raid window starts.
	allow_ongoing_wars_to_continue_after_window_start = true

[war_ui]
	#Chunk radius around a war target where players see the war bossbar.
	# Default: 3
	# Range: 0 ~ 64
	bossbar_visible_radius_chunks = 3
